# CI: lint and test the backend and frontend, then build both images, run the
# mock stack (no model, no GPU) and smoke-test a real upload through nginx.
# Live-model tests (pytest -m ollama) never run here: they need a GPU and a model.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, pytest, fixture drift)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Ruff (backend and scripts)
        working-directory: backend
        run: |
          ruff check . ../scripts --config pyproject.toml
          ruff format --check . ../scripts --config pyproject.toml

      - name: Pytest (mock provider only)
        working-directory: backend
        run: pytest

      # tests/test_frontend_fixtures.py fails if the API output differs from the
      # committed frontend fixtures; this also catches a fixture that was missing
      # and got written during the run.
      - name: Frontend fixtures match the API
        run: git diff --exit-code -- frontend/src/test/fixtures && test -z "$(git status --porcelain -- frontend/src/test/fixtures)"

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker (build, mock compose, smoke test)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose -f docker-compose.mock.yml build

      - name: Start the mock stack and wait until healthy
        run: docker compose -f docker-compose.mock.yml up -d --wait --wait-timeout 120

      - name: Smoke test through the frontend's nginx
        run: bash scripts/smoke_test.sh http://127.0.0.1:8080 120

      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.mock.yml logs --no-color

      - name: Stop
        if: always()
        run: docker compose -f docker-compose.mock.yml down -v
