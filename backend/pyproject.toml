# Tool configuration for the backend. Dependencies live in requirements*.txt
# (installed by the setup scripts and, from M5, the Dockerfile).

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, S bandit (security), SIM simplify
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# assert is the normal way to write pytest checks
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends() in argument defaults is the framework's intended pattern.
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Live-model tests are opt-in: they need a running Ollama with the model pulled.
# Run them with:  pytest -m ollama   (a -m on the command line overrides this one)
addopts = "-m 'not ollama'"
markers = [
    "ollama: integration test against a real local Ollama model (skipped by default and in CI)",
]
