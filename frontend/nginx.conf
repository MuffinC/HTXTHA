# nginx config for the frontend container (a template: ${...} values are
# substituted from the environment at start-up by the nginx image's entrypoint;
# nginx's own $variables are left alone because they are not set in the environment).
#
# Serves the built app and proxies /api to the backend, so the browser talks to
# one origin and the backend needs no CORS configuration.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Uploads: nginx's default limit is 1 MB, which would break most uploads.
    # Must be at least MAX_FILES x MAX_FILE_MB plus ~1 MB of multipart overhead
    # (default 10 x 25 MB = 250 MB -> 260m). The backend enforces the real limits
    # and returns a proper error envelope; this only has to be large enough.
    client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};

    # ---- API (including /api/docs and /api/openapi.json) ---------------------
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Upload validation runs before the response; give large uploads time.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- container healthcheck -------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- static app ------------------------------------------------------------
    # Hashed asset files never change, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Single-page app: unknown paths serve index.html (the job lives in ?job=...).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        # Everything the app needs is same-origin (fonts are bundled, no CDN).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }
}
